<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Monetag Ads - Zone 11115482</title>

<!-- Monetag SDK dengan zone 11115482 (UTAMA) -->
<script src='//libtl.com/sdk.js' data-zone='11115482' data-sdk='show_11115482'></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00c853, #69f0ae);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .zone-badge {
            text-align: center;
            background: rgba(0,200,83,0.2);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #00c853;
            font-family: monospace;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }
        
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00c853;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn-start {
            background: #00c853;
            color: #000;
        }
        
        .btn-stop {
            background: #f44336;
            color: white;
        }
        
        .btn-test {
            background: #2196f3;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        
        .status {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }
        
        .status-running {
            color: #00c853;
        }
        
        .status-stopped {
            color: #f44336;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            padding: 12px 20px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
            border-left: 4px solid #00c853;
        }
        
        .toast.error {
            border-left-color: #f44336;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .log {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 10px;
        }
        
        .log-entry {
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>⚡ AUTO MONETAG</h1>
            <div class="zone-badge">
                🎯 ZONE ID UTAMA: <strong>11115482</strong> | show_11115482()
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="adCount">0</div>
                    <div class="stat-label">Iklan Ditampilkan</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="sessionCount">0</div>
                    <div class="stat-label">Total Sesi</div>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-start" id="startBtn" onclick="startAds()">▶ START</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopAds()" disabled>⏹ STOP</button>
                <button class="btn btn-test" id="testBtn" onclick="testAd()">🔍 TEST AD</button>
            </div>
            
            <div class="status" id="status">
                Status: <span id="statusText" class="status-stopped">Berhenti</span>
            </div>
            
            <div class="log" id="log">
                <div class="log-entry">📋 Log akan muncul di sini...</div>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>

    <script>
        // ============================================
        // ZONE UTAMA: 11115482
        // Fungsi: show_11115482()
        // ============================================
        
        let adCount = 0;
        let sessionCount = 0;
        let isRunning = false;
        let intervalId = null;
        
        // Ambil elemen DOM
        const adCountEl = document.getElementById('adCount');
        const sessionCountEl = document.getElementById('sessionCount');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const logEl = document.getElementById('log');
        
        // Fungsi untuk menampilkan toast
        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerHTML = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Fungsi untuk menambah log
        function addLog(message, isError = false) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.style.color = isError ? '#f44336' : '#00c853';
            logEntry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(logEntry);
            logEl.scrollTop = logEl.scrollHeight;
            
            // Hapus log jika terlalu banyak
            while (logEl.children.length > 50) {
                logEl.removeChild(logEl.firstChild);
            }
        }
        
        // ============ FUNGSI UTAMA UNTUK MENAMPILKAN IKLAN ============
        function showAd() {
            addLog('🔄 Mencoba menampilkan iklan...');
            
            // CEK FUNGSI SDK DENGAN ZONE 11115482
            if (typeof window.show_11115482 === 'function') {
                try {
                    addLog('✅ Memanggil show_11115482()');
                    window.show_11115482();  // ← ZONE UTAMA 11115482
                    
                    // Update statistik
                    adCount++;
                    adCountEl.innerText = adCount;
                    
                    addLog(`🎉 Iklan berhasil ditampilkan! (Total: ${adCount})`);
                    showToast('✅ Iklan ditampilkan!');
                    
                    return true;
                } catch (error) {
                    addLog(`❌ Error: ${error.message}`, true);
                    showToast(`Error: ${error.message}`, true);
                    return false;
                }
            } else {
                // SDK belum siap
                addLog('⚠️ SDK show_11115482() belum tersedia', true);
                addLog('💡 Pastikan script SDK berhasil dimuat', true);
                showToast('SDK Monetag belum siap!', true);
                
                // Cek apakah ada fungsi lain
                console.log('Available functions:', Object.keys(window).filter(k => k.includes('show_')));
                
                return false;
            }
        }
        
        // Fungsi test untuk mencoba iklan sekali
        function testAd() {
            addLog('🔬 TEST MODE: Mencoba iklan sekali...');
            showAd();
        }
        
        // Mulai auto ads (setiap 5-10 detik)
        function startAds() {
            if (isRunning) {
                addLog('⚠️ Auto ads sudah berjalan');
                return;
            }
            
            isRunning = true;
            sessionCount++;
            sessionCountEl.innerText = sessionCount;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusText.innerText = 'Berjalan';
            statusText.className = 'status-running';
            
            addLog('🚀 AUTO ADS DIMULAI (Zone: 11115482)');
            addLog(`📊 Interval: 5-10 detik per iklan`);
            showToast('Auto ads dimulai!');
            
            // Tampilkan iklan pertama
            setTimeout(() => {
                if (isRunning) showAd();
            }, 2000);
            
            // Set interval random antara 5-10 detik
            function scheduleNext() {
                if (!isRunning) return;
                
                const delay = Math.floor(Math.random() * 5000) + 5000; // 5-10 detik
                addLog(`⏱ Next ad in ${(delay/1000).toFixed(1)}s`);
                
                intervalId = setTimeout(() => {
                    if (isRunning) {
                        showAd();
                        scheduleNext();
                    }
                }, delay);
            }
            
            scheduleNext();
        }
        
        // Berhenti auto ads
        function stopAds() {
            if (!isRunning) return;
            
            isRunning = false;
            
            if (intervalId) {
                clearTimeout(intervalId);
                intervalId = null;
            }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.innerText = 'Berhenti';
            statusText.className = 'status-stopped';
            
            addLog('🛑 AUTO ADS DIHENTIKAN');
            showToast('Auto ads dihentikan');
        }
        
        // Cek ketersediaan SDK saat halaman dimuat
        function checkSDK() {
            addLog('🔍 Mengecek SDK Monetag...');
            
            setTimeout(() => {
                if (typeof window.show_11115482 === 'function') {
                    addLog('✅ SDK MONETAG SIAP!');
                    addLog('🎯 Zone ID: 11115482 siap digunakan');
                    addLog('💡 Klik START untuk memulai auto ads');
                    showToast('✅ SDK Monetag siap!');
                } else {
                    addLog('❌ SDK Monetag TIDAK DITEMUKAN', true);
                    addLog('💡 Periksa:');
                    addLog('   1. Koneksi internet', true);
                    addLog('   2. Domain libtl.com bisa diakses', true);
                    addLog('   3. Tidak ada adblocker', true);
                    showToast('⚠️ SDK gagal dimuat! Cek koneksi', true);
                    
                    // Tampilkan fungsi yang tersedia untuk debugging
                    const showFuncs = Object.keys(window).filter(k => k.includes('show_'));
                    if (showFuncs.length > 0) {
                        addLog(`📋 Fungsi show_ tersedia: ${showFuncs.join(', ')}`);
                    }
                }
            }, 2000);
        }
        
        // Inisialisasi
        function init() {
            checkSDK();
            
            // Load data dari localStorage
            const saved = localStorage.getItem('monetag_11115482');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    adCount = data.adCount || 0;
                    sessionCount = data.sessionCount || 0;
                    adCountEl.innerText = adCount;
                    sessionCountEl.innerText = sessionCount;
                    addLog(`📀 Loaded stats: ${adCount} ads dari session sebelumnya`);
                } catch(e) {}
            }
        }
        
        // Simpan data setiap ada perubahan
        function saveData() {
            localStorage.setItem('monetag_11115482', JSON.stringify({
                adCount: adCount,
                sessionCount: sessionCount,
                lastUpdate: new Date().toISOString()
            }));
        }
        
        // Auto save setiap detik
        setInterval(saveData, 1000);
        
        // Start
        init();
        
        // Cleanup saat page ditutup
        window.addEventListener('beforeunload', () => {
            if (isRunning) stopAds();
        });
    </script>
</body>
</html>
